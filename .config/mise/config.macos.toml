[bootstrap.macos.dock]
autohide = true
orientation = "bottom"
magnification = true
tilesize = 44
largesize = 48
show_recents = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
show_extensions_warning = false
preferred_view_style = "list"
sort_folders_first = true
save_new_documents_to_cloud = false

[bootstrap.macos.keyboard]
key_repeat = 1
initial_key_repeat = 15
press_and_hold = false
automatic_capitalization = false
automatic_spelling_correction = false

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true


[bootstrap.macos.defaults]
"com.apple.finder" = {
    FXDefaultSearchScope = "SCcf",  # search current folder
    NewWindowTarget = "PfHm",       # home folder; no NewWindowTargetPath needed
    QuitMenuItem = true,
    WarnOnEmptyTrash = false,
    _FXShowPosixPathInTitle = true,
}
"com.apple.desktopservices" = {
    DSDontWriteNetworkStores = true,
    DSDontWriteUSBStores = true
}
"com.apple.dock" = {
    enable-spring-load-actions-on-all-items = true,
    mineffect = "genie",
    mouse-over-hilite-stack = true,
    show-process-indicators = true,
    showhidden = true,
}
"com.apple.screensaver" = { 
    # NOTE: might not actually work anymore
    askForPassword = true,
    askForPasswordDelay = 0
}
"com.apple.screencapture" = { location = "{{env.HOME}}/Screenshots" }
"NSGlobalDomain" = {
    AppleKeyboardUIMode = 2,  # keyboard navigation (Sonoma+)
    AppleShowAllExtensions = true,
    NSAutomaticDashSubstitutionEnabled = false,
    NSAutomaticPeriodSubstitutionEnabled = false,
    NSAutomaticQuoteSubstitutionEnabled = false,
    NSNavPanelExpandedStateForSaveMode = true,
    NSNavPanelExpandedStateForSaveMode2 = true,
    NSStatusItemSelectionPadding = 6,
    NSStatusItemSpacing = 6,
    PMPrintingExpandedStateForPrint = true,
    PMPrintingExpandedStateForPrint2 = true,
    _HIHideMenuBar = false,
}

# Snap to grid, replacing the PlistBuddy hook lines
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "DesktopViewSettings"
path = ["IconViewSettings", "arrangeBy"]
value = "grid"

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "FK_StandardViewSettings"
path = ["IconViewSettings", "arrangeBy"]
value = "grid"

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.finder"
key = "StandardViewSettings"
path = ["IconViewSettings", "arrangeBy"]
value = "grid"

[bootstrap.files."/etc/pam.d/sudo_local"]
# enables Touch ID for sudo
content = "auth       sufficient     pam_tid.so"
owner = "root"
group = "wheel"
mode = "0444"

[bootstrap.hooks.post-defaults]
run = [
    'mkdir -p "$HOME/Screenshots" && defaults write com.apple.screencapture location "$HOME/Screenshots"',
    "killall Finder || true",
    "killall Dock || true",
    "chflags nohidden ~/Library",
    "sudo chflags nohidden /Volumes"
]
