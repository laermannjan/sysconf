git:
  autoFetch: true
  diffRenderers:
    - type: extDiff
      command: difft --color=always --context={{diffContext}}
      name: difftastic
    - command: delta --paging=never --features="my-theme zebra-dark lazygit" # --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
      name: delta
    - type: rawGit
      args: [--color-words]
      name: color-words
gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    cherryPiCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    defaultFgColor:
      - '#cdd6f4'
    inactiveBorderColor:
      - '#a6adc8'
    optionsTextColor:
      - '#89b4fa'
    searchingActiveBorderColor:
      - '#f9e2af'
    selectedLineBgColor:
      - '#313244'
    selectedRangeBgColor:
      - '#313244'
    unstagedChansColor:
      - '#f38ba8'
